<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seguimiento de Recicladores - REDECOL</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="LOGO SIN FONDO.png" type="image/png">
</head>
<body>

<header>
  <img src="LOGO SIN FONDO.png" alt="Logo REDECOL E.S.P." id="logo">
  <h1>REDECOL E.S.P.</h1>
  <p>Seguimiento de Recolección</p>
</header>

<div class="container">
  <h2>Registro de Usuario</h2>
  <form id="registroForm">
    <input type="text" id="nombre" placeholder="Nombre o Razón Social" required>
    <input type="text" id="nit" placeholder="NIT o Cédula" required>
    <input type="text" id="direccion" placeholder="Dirección" required>
    <input type="text" id="sector" placeholder="Sector" required>
    <input type="text" id="telefono" placeholder="Teléfono" required>
    <input type="email" id="correo" placeholder="Correo Electrónico" required>
    <button type="submit">Registrar</button>
  </form>

  <hr>

  <h2>Control de Seguimiento</h2>
  <input type="text" id="nombreReciclador" placeholder="Nombre o ID del reciclador">
  <div class="buttons">
    <button id="iniciarSeguimiento" type="button">📍 Iniciar seguimiento</button>
    <button id="detenerSeguimiento" type="button" disabled>⏹️ Detener seguimiento</button>
    <button id="grabarRecorrido" type="button">⏺️ Grabar Recorrido</button>
  </div>

  <h3>Estado del Servicio:</h3>
  <div class="buttons">
    <button type="button" onclick="cambiarEstado('Disponible')">Disponible</button>
    <button type="button" onclick="cambiarEstado('En Ruta')">En Ruta</button>
    <button type="button" onclick="cambiarEstado('Finalizado')">Finalizado</button>
  </div>

  <h3>Visualización de Rutas:</h3>
  <div class="buttons">
    <button type="button" onclick="cargarRuta()">Ver mi ruta</button>
    <button type="button" onclick="mostrarTrayectoria(document.getElementById('nombreReciclador').value)">Ver trayectoria individual</button>
    <button type="button" onclick="mostrarTodasTrayectorias()">Ver todas las trayectorias</button>
  </div>

  <h3>Seguimiento en Vivo</h3>
  <div class="buttons">
    <button type="button" onclick="verEnVivo()">📡 Ver en vivo</button>
  </div>

  <h3>Fotos en Ruta</h3>
  <div class="buttons">
    <button type="button" onclick="toggleCamera()">📷 Activar/Desactivar Cámara</button>
    <button type="button" onclick="mostrarFotosEnMapa()">🖼️ Ver Fotos en el Mapa</button>
    <button type="button" onclick="mostrarTodasFotos()">🌍 Ver todas las fotos</button>
    <button type="button" onclick="generarReportePDF()">📄 Generar Reporte en PDF</button>
  </div>

  <div id="cameraContainer" style="display: none;">
    <video id="cameraFeed" autoplay></video>
    <button id="takePhoto" type="button" onclick="takePicture()">Tomar Foto</button>
    <canvas id="photoCanvas" style="display: none;"></canvas>
    <div id="photoPreview"></div>
  </div>

  <div id="map" style="height: 400px; width: 100%;"></div>

  <h3>Descargar Datos:</h3>
  <div class="buttons">
    <button type="button" onclick="descargarRutaXLSX()">📥 Descargar Ruta (.xlsx)</button>
    <button type="button" onclick="descargarTrayectoriaImagen()">🖼️ Descargar Trayectoria (Imagen)</button>
  </div>

  <h2>Usuarios Registrados</h2>
  <table id="tablaUsuarios">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>NIT/Cédula</th>
        <th>Dirección</th>
        <th>Sector</th>
        <th>Teléfono</th>
        <th>Correo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Firebase y jsPDF -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- SheetJS para generar archivos Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBd25hLnwk72yO9E7ovKkB6Ba5RA0F_3aI",
    authDomain: "redecol-74a1b.firebaseapp.com",
    projectId: "redecol-74a1b",
    storageBucket: "redecol-74a1b.appspot.com",
    messagingSenderId: "286437914537",
    appId: "1:286437914537:web:151e8791eed28189fef6b8",
    measurementId: "G-M9MJ2LJ010"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  // Asegúrate de que initMap existe
  function initMap() {}

  // Ejemplo: arreglo de coordenadas (simulación)
  let coordinates = []; // Este debe llenarse con lat/lng/address reales durante el seguimiento

  function descargarRutaXLSX() {
    if (coordinates.length === 0) {
      alert("No hay coordenadas para exportar.");
      return;
    }

    const worksheetData = coordinates.map(coord => ({
      Latitud: coord.lat,
      Longitud: coord.lng,
      Dirección: coord.address || "Sin dirección"
    }));

    const worksheet = XLSX.utils.json_to_sheet(worksheetData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Ruta");

    XLSX.writeFile(workbook, "ruta_reciclador.xlsx");
  }
</script>

<script src="script.js"></script>
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBEO4kGVuRJbZ9pf4Ruf-V21ZuPLBKl6z0&callback=initMap&loading=async">
</script>

</body>
</html>
